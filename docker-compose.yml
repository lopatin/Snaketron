version: '3.8'

services:
  localstack:
    # 4.x, not 3.x: the analytics pipeline's idempotency rests on S3
    # conditional writes (If-None-Match), which AWS shipped in Aug 2024 and
    # LocalStack implements only in its 4.x line. Verified against 4.0.3: the
    # conditional-write test returns AlreadyPresent on the second PUT, and the
    # DynamoDB-backed suite is unaffected by the bump.
    #
    # Keep this pin in lockstep with the two CI workflows
    # (.github/workflows/github-action-test-simple-game.yml here, and
    # snaketron-io's .github/workflows/test.yml) so a local run and a CI run
    # exercise the same LocalStack.
    image: localstack/localstack:4.0
    container_name: snaketron-localstack
    environment:
      # s3 is required by the analytics pipeline tests, which write gzipped
      # NDJSON and rely on conditional writes (If-None-Match) for idempotency.
      - SERVICES=dynamodb,s3
      - DEBUG=0
      - PERSISTENCE=0
      - AWS_DEFAULT_REGION=us-east-1
      - SNAKETRON_REPLAY_S3_BUCKET=snaketron-replays-dev
      - SNAKETRON_REPLAY_S3_PREFIX=recordings
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566:4566"
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init.sh:/etc/localstack/init/ready.d/init-snaketron.sh"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snaketron-network

  redis:
    image: valkey/valkey:8-alpine
    container_name: snaketron-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snaketron-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: snaketron-server
    environment:
      # DynamoDB configuration
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: snaketron
      # Private durable replay object storage (LocalStack in development).
      SNAKETRON_REPLAY_S3_BUCKET: snaketron-replays-dev
      SNAKETRON_REPLAY_S3_PREFIX: recordings
      SNAKETRON_REPLAY_S3_FORCE_PATH_STYLE: "true"
      SNAKETRON_REPLAY_S3_STORAGE_CLASS: STANDARD
      # Recent verified recordings are cached in Valkey; cache failures fall
      # back to the private replay bucket.
      SNAKETRON_REPLAY_CACHE_PREFIX: snaketron:replay-cache
      SNAKETRON_REPLAY_CACHE_TTL_SECONDS: "3600"
      SNAKETRON_REPLAY_CACHE_MAX_BYTES: "8388608"
      SNAKETRON_REPLAY_CACHE_TIMEOUT_MS: "250"
      # Keep completed games loadable from DynamoDB for 30 days.
      SNAKETRON_COMPLETED_GAME_RETENTION_DAYS: 30
      # Server configuration
      SNAKETRON_HTTP_PORT: 8080
      SNAKETRON_GRPC_PORT: 50051
      SNAKETRON_REGION: us
      SNAKETRON_ENV: dev
      # New team matches snapshot this once at creation (valid range 1.000-2.000).
      SNAKETRON_BOOST_SPEED_MULTIPLIER: "1.500"
      # New multiplayer matches warn after 10s idle, then kick after a 10s countdown.
      SNAKETRON_PLAYER_IDLE_GRACE_MS: "${SNAKETRON_PLAYER_IDLE_GRACE_MS:-10000}"
      SNAKETRON_PLAYER_IDLE_COUNTDOWN_MS: "${SNAKETRON_PLAYER_IDLE_COUNTDOWN_MS:-10000}"
      # Advertisement policy is resolved by the server at startup and is off by default.
      # Each distribution remains disabled until it names a provider. Its
      # placement-specific switches then inherit that distribution's enabled state.
      SNAKETRON_ADS_ENABLED: "false"
      SNAKETRON_ADS_WEB_PROVIDER: "none"
      SNAKETRON_ADS_CRAZYGAMES_PROVIDER: "none"
      SNAKETRON_ADS_ITCH_PROVIDER: "none"
      SNAKETRON_AD_BREAK_TIMEOUT_SECONDS: "120"
      # Logging
      RUST_LOG: info,server=debug
      # Replay directory (using volume)
      SNAKETRON_REPLAY_DIR: /var/lib/snaketron/replays
      # Test mode - accept any token (set to "true" for testing without auth)
      # SNAKETRON_TEST_MODE: "true"
      # JWT secret (use a secure secret in production)
      SNAKETRON_JWT_SECRET: "development-secret-key-change-in-production"
      # Redis configuration for membership, assignment, leases, and streams
      SNAKETRON_REDIS_URL: "redis://redis:6379"
    ports:
      - "8080:8080"   # HTTP port (API + WebSocket)
      - "50051:50051" # gRPC port
    volumes:
      - ./replays:/var/lib/snaketron/replays
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - snaketron-network

networks:
  snaketron-network:
    driver: bridge

volumes:
  valkey-data:
