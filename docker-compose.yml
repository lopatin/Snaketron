version: '3.8'

services:
  localstack:
    # 4.x, not 3.x: the analytics pipeline's idempotency rests on S3
    # conditional writes (If-None-Match), which AWS shipped in Nov 2024 and
    # LocalStack only implements in its 4.x line. NOTE: this bump was not
    # exercised locally (Docker would not start on the authoring machine), so
    # the first CI run is what confirms DynamoDB behaviour is unchanged.
    image: localstack/localstack:4.0
    container_name: snaketron-localstack
    environment:
      # s3 is required by the analytics pipeline tests, which write gzipped
      # NDJSON and rely on conditional writes (If-None-Match) for idempotency.
      - SERVICES=dynamodb,s3
      - DEBUG=0
      - PERSISTENCE=0
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566:4566"
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init.sh:/etc/localstack/init/ready.d/init-dynamodb.sh"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snaketron-network

  redis:
    image: valkey/valkey:8-alpine
    container_name: snaketron-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snaketron-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: snaketron-server
    environment:
      # DynamoDB configuration
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: snaketron
      # Keep completed games loadable from DynamoDB for 30 days.
      SNAKETRON_COMPLETED_GAME_RETENTION_DAYS: 30
      # Server configuration
      SNAKETRON_HTTP_PORT: 8080
      SNAKETRON_GRPC_PORT: 50051
      SNAKETRON_REGION: us
      SNAKETRON_ENV: dev
      # New team matches snapshot this once at creation (valid range 1.000-2.000).
      SNAKETRON_BOOST_SPEED_MULTIPLIER: "1.500"
      # Logging
      RUST_LOG: info,server=debug
      # Replay directory (using volume)
      SNAKETRON_REPLAY_DIR: /var/lib/snaketron/replays
      # Test mode - accept any token (set to "true" for testing without auth)
      # SNAKETRON_TEST_MODE: "true"
      # JWT secret (use a secure secret in production)
      SNAKETRON_JWT_SECRET: "development-secret-key-change-in-production"
      # Redis configuration for membership, assignment, leases, and streams
      SNAKETRON_REDIS_URL: "redis://redis:6379"
    ports:
      - "8080:8080"   # HTTP port (API + WebSocket)
      - "50051:50051" # gRPC port
    volumes:
      - ./replays:/var/lib/snaketron/replays
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - snaketron-network

networks:
  snaketron-network:
    driver: bridge

volumes:
  valkey-data:
