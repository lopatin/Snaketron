name: Test Simple Game

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinning Rust keeps cache keys and transported test binaries reproducible.
  RUST_VERSION: 1.97.1
  # Build and run the archive with exactly the same nextest release. Archive
  # metadata is not guaranteed to be compatible across nextest releases.
  NEXTEST_VERSION: 0.9.137

jobs:
  # Keep the deployment gates unchanged. This job also owns doctests because
  # nextest intentionally covers libtest unit/integration tests, not rustdoc.
  quality:
    name: Format, Clippy, and Documentation Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
          protoc --version

      # These two commands must stay identical to the deployment gate in the
      # snaketron-io repository's .github/workflows/test.yml.
      - name: Run cargo fmt check (same gate as snaketron-io)
        run: cargo fmt --all -- --check

      - name: Run cargo clippy (same gate as snaketron-io)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Also identical to the snaketron-io gate. The analytics proto is the
      # Iceberg table's schema and iceberg-rust can only add and delete
      # columns, so a rename or retype reaches the table as drop+add and
      # silently orphans the data already written under the old name.
      - name: Check the analytics schema lock (same gate as snaketron-io)
        run: cargo test -p server --lib analytics::schema

      # The lock only protects the field numbers it records, so an unrecorded
      # proto change must not reach main either.
      - name: Require the analytics schema lock to be current
        env:
          UPDATE_SCHEMA_LOCK: 1
        run: |
          set -euo pipefail
          lock=server/proto/analytics/v1/events.schema.lock
          cargo test -p server --lib analytics::schema
          # status, not diff: an uncommitted lock file is untracked, and a
          # `git diff` against nothing would pass and protect nothing.
          if [ -n "$(git status --porcelain -- "$lock")" ]; then
            git diff -- "$lock" || true
            echo "::error file=$lock::Stale schema lock. Regenerate with 'UPDATE_SCHEMA_LOCK=1 cargo test -p server --lib analytics::schema' and commit it."
            exit 1
          fi

      - name: Compile all test targets (no run)
        env:
          RUST_BACKTRACE: 1
        run: |
          echo "Compiling every test target in the workspace..."
          cargo test --all --no-run
      - name: Run documentation tests
        run: cargo test --workspace --doc

  # Compile every libtest target once on a trusted Linux runner and transport
  # those exact binaries to the isolated test runners. This replaces both the
  # old compile-only job and the duplicate compilation in the test job.
  build-test-archive:
    name: Build All Test Targets Once
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
          protoc --version

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
          fallback: none

      - name: Compile and archive every workspace test target
        env:
          # Full test debuginfo made the local build 24% slower and its target
          # directory 59% larger. Backtraces still retain symbol names.
          CARGO_PROFILE_TEST_DEBUG: 0
        run: >-
          cargo nextest archive
          --workspace
          --locked
          --archive-file nextest-archive.tar.zst

      - name: Upload exact-commit test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-${{ github.sha }}
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          # The archive is already zstd-compressed; recompressing it wastes CPU.
          compression-level: 0

  # Tests inside one shard stay serial because the integration harnesses flush
  # shared Redis databases and mutate process-wide environment variables. Each
  # runner gets two measured, non-overlapping eighth-slices; slowest/fastest
  # pairing held the four projected test totals to 116.7-124.6 seconds. The four
  # runners and their isolated service containers execute concurrently.
  tests:
    name: Tests (shard ${{ matrix.shard }}/4)
    needs: build-test-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            partition_a: "slice:1/8"
            partition_b: "slice:7/8"
          - shard: 2
            partition_a: "slice:5/8"
            partition_b: "slice:6/8"
          - shard: 3
            partition_a: "slice:8/8"
            partition_b: "slice:2/8"
          - shard: 4
            partition_a: "slice:3/8"
            partition_b: "slice:4/8"

    services:
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 4.x, not 3.x: the analytics e2e tests write through S3 conditional
      # writes (If-None-Match), which only the 4.x line implements. Keep this
      # pinned in lockstep with snaketron/docker-compose.yml so a local run and
      # a CI run exercise the same LocalStack.
      localstack:
        image: localstack/localstack:4.0
        env:
          SERVICES: dynamodb,s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Nextest archives require the source tree at the same revision for test
      # fixtures and runtime CARGO_MANIFEST_DIR values.
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare cargo-nextest installation directory
        run: mkdir -p ~/.cargo/bin

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
          fallback: none

      - name: Download exact-commit test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-${{ github.sha }}

      - name: Run duration-balanced partitions
        id: run_tests
        env:
          PARTITION_A: ${{ matrix.partition_a }}
          PARTITION_B: ${{ matrix.partition_b }}
          REDIS_URL: redis://localhost:6379
          SNAKETRON_REDIS_URL: redis://localhost:6379
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_TABLE_PREFIX: snaketron
          # Make the analytics e2e tests a hard requirement rather than a
          # silent skip. Without this they still report `ok` when S3 or Valkey
          # is missing, so a green run would say nothing about whether the
          # pipeline works. They target the LocalStack service above; reaching
          # real AWS needs SNAKETRON_E2E_S3_ENDPOINT=aws, which CI never sets.
          SNAKETRON_E2E: "1"
          RUST_LOG: info
          RUST_BACKTRACE: 1
        run: |
          report_dir="$RUNNER_TEMP/nextest-reports"
          extract_dir="$RUNNER_TEMP/nextest-extract"
          mkdir -p "$report_dir" "$extract_dir"
          overall_status=0
          partitions=("$PARTITION_A" "$PARTITION_B")

          for partition in "${partitions[@]}"; do
            report_name="${partition/:/-}"
            report_name="${report_name//\//-}"

            if cargo-nextest nextest run \
              --archive-file nextest-archive.tar.zst \
              --extract-to "$extract_dir" \
              --extract-overwrite \
              --workspace-remap "$GITHUB_WORKSPACE" \
              --profile ci \
              --partition "$partition" \
              --run-ignored default
            then
              :
            else
              overall_status=1
            fi

            junit=target/nextest/ci/junit.xml
            if [[ -f "$junit" ]]; then
              mv "$junit" "$report_dir/$report_name.xml"
            fi
          done

          exit "$overall_status"

      - name: Upload partition test reports
        if: failure() && steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/nextest-reports/*.xml
          if-no-files-found: error
          retention-days: 7

  # The wasm build, and only the wasm build.
  #
  # This was the skin pixel-parity gate: every shipped skin rendered headless
  # and compared against a committed baseline sheet. It was removed as too
  # expensive for what it caught — a Chromium install, a browser run, and a
  # megabyte of baseline PNGs that had to be re-blessed whenever any shared
  # painting changed.
  #
  # What is kept is the part that was never really about skins. This is the
  # only job that compiles to `wasm32`, so without it a `#[cfg(target_arch =
  # "wasm32")]` block or a `#[wasm_bindgen]` signature can break and every
  # other job still passes — the failure surfacing when somebody loads the
  # game. It costs a couple of minutes and no browser.
  wasm-build:
    name: WASM Build and Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned, not `latest`. wasm-pack moved from rustwasm/ to
          # wasm-bindgen/, so the action's lookup of the latest release now
          # gets a 301 it does not follow, silently falls back to its built-in
          # default of v0.9.1 — a 2020 release — and that wasm-opt cannot parse
          # what rustc 1.97 emits. The job then fails with "error in parsing
          # input" from a toolchain nobody asked for. Release downloads still
          # redirect, so the old path resolves this version fine.
          version: 'v0.15.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Build the wasm package
        run: wasm-pack build --target web --out-dir pkg
        working-directory: client

      - name: Install web dependencies
        run: npm ci
        working-directory: client/web

      # Needs the wasm build above: the generated client.d.ts is what types
      # every `getWasm()` call site.
      - name: Type-check the web client
        run: npx tsc --noEmit
        working-directory: client/web

      # The type check never runs webpack, so nothing here previously exercised
      # the production bundle. Two failures could reach a release unnoticed: a
      # broken webpack config, and a GameAnalytics key that no longer has the
      # exact shape the SDK demands (32/40 alphanumeric). The SDK declines to
      # initialize on a malformed key without a failed request to notice, so
      # the build guard is the only thing that catches a bad rotation — and it
      # is worth catching here rather than in a silently dead release.
      #
      # This bundle is never deployed and never runs, so it reports nothing.
      #
      # The assertion below is the one that matters most: a build succeeding
      # proves only that webpack ran. The production client shipped for a full
      # release cycle with both keys compiled to the empty string, and every
      # build was green throughout. Only checking that the key reached the
      # artifact distinguishes "built" from "would actually report".
      - name: Build the production web bundle
        working-directory: client/web
        env:
          GAME_ANALYTICS_GAME_KEY: ${{ vars.GAME_ANALYTICS_GAME_KEY }}
          GAME_ANALYTICS_SECRET_KEY: ${{ secrets.GAME_ANALYTICS_SECRET_KEY }}
          # GameAnalytics caps the build label at 32 characters and silently
          # keeps its default past that, so a full 40-character SHA cannot be
          # used here.
          GAME_ANALYTICS_REQUIRED: 'true'
        run: |
          set -euo pipefail
          GAME_ANALYTICS_BUILD="ci-${GITHUB_SHA::12}" npm run build:prod
          if ! grep -rlq "$GAME_ANALYTICS_GAME_KEY" dist/; then
            echo "::error::The game key never reached the bundle - this build would report nothing"
            exit 1
          fi
          echo "✅ Game key is compiled into the production bundle"

      # The switch that takes analytics back out of a reviewed release package
      # has no other test: it only shows up in the shape of a built artifact.
      # Without this, the escape hatch CRAZYGAMES.md promises could rot and
      # nobody would find out until a portal asked for it.
      - name: Assert the embedded opt-out removes the analytics SDK
        working-directory: client/web
        env:
          GAME_ANALYTICS_GAME_KEY: ${{ vars.GAME_ANALYTICS_GAME_KEY }}
          GAME_ANALYTICS_SECRET_KEY: ${{ secrets.GAME_ANALYTICS_SECRET_KEY }}
          CRAZYGAMES_BUILD: 'true'
          GAME_ANALYTICS_DISABLE_EMBEDDED: 'true'
        run: |
          npm run build:prod
          if grep -rlq "HmacSHA256" dist/; then
            echo "::error::GameAnalytics SDK code is present in an opted-out embedded package"
            exit 1
          fi
          if [ -n "$GAME_ANALYTICS_GAME_KEY" ] && grep -rlq "$GAME_ANALYTICS_GAME_KEY" dist/; then
            echo "::error::GameAnalytics keys are present in an opted-out embedded package"
            exit 1
          fi
