# Production override for AWS Fargate deployment
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  # In production, we don't run the database in the same task
  # Database should be AWS RDS or a separately managed service
  db:
    deploy:
      replicas: 0  # Don't deploy database in production

  server:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/snaketron-server:${IMAGE_TAG}
    environment:
      # Override with production database settings
      SNAKETRON_DB_HOST: ${PROD_DB_HOST}
      SNAKETRON_DB_PORT: ${PROD_DB_PORT}
      SNAKETRON_DB_USER: ${PROD_DB_USER}
      SNAKETRON_DB_PASS: ${PROD_DB_PASS}
      SNAKETRON_DB_NAME: ${PROD_DB_NAME}
      # Production region
      SNAKETRON_REGION: ${AWS_REGION}
      # Private S3 replay archive. The task role needs only GetObject/PutObject
      # for this prefix; bucket public access remains blocked.
      SNAKETRON_REPLAY_S3_BUCKET: ${SNAKETRON_REPLAY_S3_BUCKET:?set SNAKETRON_REPLAY_S3_BUCKET}
      SNAKETRON_REPLAY_S3_PREFIX: ${SNAKETRON_REPLAY_S3_PREFIX:-recordings}
      SNAKETRON_REPLAY_S3_STORAGE_CLASS: ${SNAKETRON_REPLAY_S3_STORAGE_CLASS:-INTELLIGENT_TIERING}
      SNAKETRON_REPLAY_S3_KMS_KEY_ID: ${SNAKETRON_REPLAY_S3_KMS_KEY_ID:-}
      SNAKETRON_REPLAY_CACHE_PREFIX: ${SNAKETRON_REPLAY_CACHE_PREFIX:-snaketron:replay-cache}
      SNAKETRON_REPLAY_CACHE_TTL_SECONDS: ${SNAKETRON_REPLAY_CACHE_TTL_SECONDS:-3600}
      SNAKETRON_REPLAY_CACHE_MAX_BYTES: ${SNAKETRON_REPLAY_CACHE_MAX_BYTES:-8388608}
      SNAKETRON_REPLAY_CACHE_TIMEOUT_MS: ${SNAKETRON_REPLAY_CACHE_TIMEOUT_MS:-250}
      SNAKETRON_POTG_ENABLED: ${SNAKETRON_POTG_ENABLED:-true}
      # Xsolla. The API key and the webhook secret are credentials and should
      # arrive from the secret store, not from a checked-in file. Sandbox is
      # explicitly off: a production deployment that accepted Xsolla's test
      # transactions would mint Snakebux for free.
      SNAKETRON_XSOLLA_MERCHANT_ID: ${SNAKETRON_XSOLLA_MERCHANT_ID:-}
      SNAKETRON_XSOLLA_PROJECT_ID: ${SNAKETRON_XSOLLA_PROJECT_ID:-}
      SNAKETRON_XSOLLA_API_KEY: ${SNAKETRON_XSOLLA_API_KEY:-}
      SNAKETRON_XSOLLA_WEBHOOK_SECRET: ${SNAKETRON_XSOLLA_WEBHOOK_SECRET:-}
      SNAKETRON_XSOLLA_SANDBOX: "false"
      SNAKETRON_XSOLLA_RETURN_URL: ${SNAKETRON_XSOLLA_RETURN_URL:-}
      SNAKETRON_XSOLLA_WEBHOOK_ALLOWED_IPS: ${SNAKETRON_XSOLLA_WEBHOOK_ALLOWED_IPS:-}
      # Production logging
      RUST_LOG: info
      # Disable test mode in production
      SNAKETRON_TEST_MODE: "false"
      # Production JWT secret should be set from environment
      SNAKETRON_JWT_SECRET: ${PROD_JWT_SECRET}
    volumes: []  # No local volumes in Fargate
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/snaketron-server
        awslogs-region: ${AWS_REGION}
        awslogs-stream-prefix: ecs
