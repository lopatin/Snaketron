{% extends "base.html" %}
{% block content %}<h2>{{ title }}</h2>{% if not operations %}<p class="muted">No unknown outcomes.</p>{% endif %}
{% for operation in operations %}<section><h3>{{ operation.id }}</h3><p>{{ operation.side_effect }} · {{ operation.stage }}</p><pre>{{ operation.failure | tojson(indent=2) }}</pre>
<form action="/actions/resolve-operation" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="operation_id" value="{{ operation.id }}"><label>Outcome<select name="resolution"><option value="confirmed_not_executed">confirmed not executed</option><option value="executed_result_recovered">executed; result recovered</option><option value="executed_output_lost">executed; output lost</option><option value="indeterminate">indeterminate</option></select></label><label>Evidence reference<input name="evidence_ref" required></label><label>Recovered result hash, when applicable<input name="result_hash"></label><label>Exact resolved model, when recovered<input name="resolved_model"></label><label>Provider request ID, when available<input name="provider_request_id"></label><label>Image media type, when applicable<input name="media_type" placeholder="image/png"></label><button type="submit">Record immutable resolution</button></form></section>{% endfor %}
{% endblock %}
