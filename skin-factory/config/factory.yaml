config_version: 1
mode: shadow
lease_seconds: 3600

paths:
  data_dir: var
  database: var/factory.sqlite3
  objects: var/objects
  repo_root: ..
  skill_dir: ../skills/author-skin
  capability_manifest: ../skin-schema/capabilities-v2.json
  direction: direction/design-direction.md
  prototype_geometry: ../skin-schema/prototype-geometry-v1.json
  gate_manifest: config/gates.yaml
  lama_manifest: lama/manifest.json
  lama_model: var/lama/big-lama-v0.1.0.pt
  lama_python: var/lama-venv/bin/python

# Model identifiers are pinned into every Attempt. A deployment may point a
# role at a versioned provider identifier, but it may not silently fall back.
models:
  task_worker:
    provider: openai_compatible
    # LM Studio accepts the short alias but advertises and returns this exact
    # fully-qualified identifier. Recovery and worker handoff are fail-closed
    # on the resolved model, so pin the identity the server actually emits.
    model: qwen/qwen3.8-27b
    base_url: http://localhost:1234/v1
    api_key_env: LMSTUDIO_API_KEY
    timeout_seconds: 300
    max_input_tokens: 131072
    max_output_tokens: 16384
  smart_text:
    provider: gemini
    model: gemini-3.7-flash
    resolved_model_pattern: '^gemini-3\.7-flash(?:-[0-9]{6,8})?$'
    thinking_level: high
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 300
    max_input_tokens: 1048576
    max_output_tokens: 65536
    # Conservative accounting reservations, not a claim about provider list
    # price. Keep them versioned and raise them before a pricing increase.
    cost_per_million_input_micros: 2000000
    cost_per_million_output_micros: 12000000
  visual_judge:
    provider: gemini
    model: gemini-3.7-flash
    resolved_model_pattern: '^gemini-3\.7-flash(?:-[0-9]{6,8})?$'
    thinking_level: high
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 300
    max_input_tokens: 1048576
    max_output_tokens: 65536
    cost_per_million_input_micros: 2000000
    cost_per_million_output_micros: 12000000
  image_generator:
    # This role is intentionally configurable. To use an OpenAI-compatible
    # image service, set provider: openai_compatible, an exact model, an API
    # root ending in /v1, and api_key_env. That adapter uses standard
    # /images/generations and /images/edits endpoints and requires inline
    # base64 results; it never fetches provider URLs or falls back to Gemini.
    provider: gemini
    model: gemini-3-pro-image
    resolved_model_pattern: '^gemini-3-pro-image(?:-[0-9]{6,8})?$'
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 600
    max_input_tokens: 1048576
    max_output_tokens: 65536
    cost_per_million_input_micros: 2000000
    cost_per_million_output_micros: 12000000
    cost_per_image_micros: 750000
  image_editor:
    provider: local_lama
    model: simple-lama
    timeout_seconds: 600
    max_input_tokens: 1
    max_output_tokens: 1

program:
  # Stop creating new concepts after this many distinct concepts have a
  # human-approved published Attempt. Existing retained/review work remains
  # available, and changing the target is an explicit versioned config edit.
  target_published_skins: 100

ideation:
  # Gemini supplies direction/novelty scores, while a deterministic token
  # similarity score prevents a model from simply declaring a duplicate novel.
  # Low-ranked briefs are retained in the rejected gallery before image spend.
  context_limit: 40
  minimum_rank_score: 0.55

halts:
  # Pause only new concept generation when recent production attempts repeat
  # the same blocking gate, or when the same high-confidence authoring root
  # cause recurs after an author-skin promotion. Retained review/recovery and
  # already-active work remain available.
  deterministic_failure_window: 12
  repeated_blocking_gate_limit: 3
  repeated_root_cause_after_promotion_limit: 2

budgets:
  max_concurrent_attempts: 1
  max_pending_prototype_reviews: 12
  max_pending_final_reviews: 8
  prototypes_per_attempt: 3
  provider_retries: 2
  max_image_slices_per_asset: 16
  max_asset_image_calls_per_attempt: 128
  wall_seconds_per_run: 1800
  max_cost_micros_per_attempt: 10000000
  max_cost_micros_per_day: 25000000
  max_cost_micros_program: 500000000

service:
  base_url: http://localhost:8080
  service_token_env: SNAKETRON_FACTORY_SERVICE_TOKEN
  operator_token_env: SNAKETRON_FACTORY_OPERATOR_TOKEN
  request_timeout_seconds: 60
  resolved_model_pattern: '^snaketron-api$'

browser:
  # This endpoint must serve client/web/dist with SPA fallback. Capture hashes
  # the received HTML/JS/CSS/WASM and refuses bytes outside the pinned cache.
  base_url: http://localhost:3000
  capture_command:
    - node
    - client/web/tests/capture-authored-skin.mjs
  timeout_seconds: 90

worker:
  adapter: openai_compatible
  endpoint: http://localhost:1234/v1
  api_key_env: LMSTUDIO_API_KEY
  max_output_tokens: 16384

review:
  bind: 127.0.0.1
  port: 8765
  operator_secret_env: SKIN_FACTORY_REVIEW_TOKEN
  sampled_reject_rate: 0.1

# A judge may suppress candidates only after independent, blind human labels
# clear all of these Wilson upper-confidence bounds. Until then a deployment
# configured for production automatically routes that stage as shadow.
judge_calibration:
  minimum_labeled_sample: 30
  confidence_level: 0.95
  max_false_approve_upper: 0.20
  max_false_reject_upper: 0.20
  max_reversal_upper: 0.20
  max_uncertainty_upper: 0.35
  max_label_age_days: 30

outbox:
  batch_size: 20
  max_attempts: 8
  initial_backoff_seconds: 30
  max_backoff_seconds: 3600
  request_timeout_seconds: 10
  webhook_url_env: SKIN_FACTORY_OUTBOX_WEBHOOK_URL
  webhook_token_env: SKIN_FACTORY_OUTBOX_WEBHOOK_TOKEN

optimizer:
  enabled: true
  # Direction, rubric, gate, platform, and uncertain feedback never edits the
  # authoring playbook. Only this target at or above this confidence is input.
  feedback_min_confidence: 0.8
  # Promotion additionally requires every frozen, fixture-specific expected
  # property to pass and forbids a candidate from regressing any such property.
  expected_property_min_score: 0.75
  expected_property_max_regression: 0.0
  generation_min_labels: 10
  promotion_min_pairs: 12
  promotion_min_effect: 0.04
  promotion_max_pair_regression: 0.10
  promotion_confidence: 0.95
  holdout_fraction: 0.2
  development_fraction: 0.2
  max_metric_calls: 80
  gepa_generations: 2
  gepa_candidates_per_generation: 3
  technique_min_fixtures: 3
  # A different Concept is not necessarily a different authoring test. This
  # minimum counts stable implementation/asset/animation topology hashes.
  technique_min_structural_signatures: 3
  # Change only after a human deliberately retires the sealed promotion set.
  # Within one epoch, a concept is queried as holdout at most once and never
  # later exposed to the teacher/development selector.
  holdout_epoch: v1
  active_skill_ref: HEAD
  promotion_remote: origin
  # Overall signed commit/tag/push/clean-clone deadline. The factory reserves
  # this plus cleanup time before it creates a promotion operation intent.
  promotion_timeout_seconds: 1200
