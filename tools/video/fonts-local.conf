<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Canvas text names Arial/Arial Black explicitly. Linux capture images do
       not ship Microsoft's fonts, so pin their metric-compatible Liberation
       Sans substitutes instead of accepting a host-dependent fallback. -->
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial Black</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>

