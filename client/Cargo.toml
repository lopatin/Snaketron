[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
common = { path = "../common" }
skin-schema = { path = "../skin-schema" }
wasm-bindgen = "0.2"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"

[dependencies.web-sys]
version = "0.3.77"
features = ['CanvasGradient', 'CanvasRenderingContext2d', 'Document', 'Element', 'HtmlCanvasElement', 'HtmlImageElement', 'Performance', 'TextMetrics', 'Window', 'console']
