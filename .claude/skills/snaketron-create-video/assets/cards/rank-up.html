<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SnakeTron Rank-Up Capture Fixture</title>
  <!--
    Mirrors the real results card (client/web/index.css .game-over-card /
    .rating-reveal): paper ground, hairline borders, 7px radii, soft elevation,
    upright Arial Black headlines. See references/brand.md.

    Fonts: the app's own stack. The capture image must provide Arial Black —
    it already must, because the arena canvas draws its labels in Arial Black
    (client/src/render.rs:286,1465,1519), so gameplay frames need it too.
    Prefer mounting the real RatingReveal component where a dev server is
    available; this fixture is the no-server fallback.
  -->
  <style>
    :root {
      --game-paper: #ffffff;
      --game-graphite: #3f3f41;
      --game-blue: #3b82f6;
      --game-red: #ef4444;
      --game-rule: #d1d5db;
      --game-muted: #667085;
      --game-boost: #f8c84a;
      --game-ink: #14181f;
      --nos-orange: #ff641e;
      --display: "Arial Black", Arial, Helvetica, sans-serif;
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background-color: var(--game-paper);
      /* The arena's 1px grid-dot texture — the game's signature motif. */
      background-image: radial-gradient(circle, var(--game-rule) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--game-ink);
      font-family: var(--ui);
    }
    .card {
      width: min(70vw, 1180px);
      border: 1px solid rgb(63 63 65 / 52%);
      border-radius: 7px;
      background: var(--game-paper);
      box-shadow: 0 18px 48px rgb(31 41 55 / 22%);
      overflow: hidden;
      transform: scale(var(--scale, .985));
      opacity: var(--opacity, 0);
    }
    .header { padding: 46px 64px 34px; border-bottom: 1.5px solid var(--game-ink); }
    .eyebrow {
      color: var(--game-muted);
      font-size: 26px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 0;
      font-family: var(--display);
      font-size: clamp(84px, 8.4vw, 150px);
      font-weight: 900; line-height: .9;
      letter-spacing: -.01em; text-transform: uppercase;
      color: var(--game-ink);
    }
    .accent { width: 168px; height: 8px; margin-top: 22px; background: var(--nos-orange); border-radius: 2px; }
    .body { padding: 44px 64px 52px; }
    .result { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
    .rank {
      padding: 24px 18px;
      border: 1px solid var(--game-rule);
      border-radius: 6px;
      background: var(--game-paper);
      text-align: center;
    }
    .rank.new {
      border: 1.5px solid var(--game-boost);
      background: #eff6ff;
      transform: scale(var(--stamp, .96));
    }
    .label {
      color: var(--game-muted);
      font-size: 22px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
    }
    .value {
      display: block; margin-top: 10px; white-space: nowrap;
      font-family: var(--display); font-size: clamp(32px, 2.6vw, 46px); font-weight: 900;
      color: var(--game-ink);
    }
    .arrow { color: var(--game-blue); font-family: var(--display); font-size: 56px; font-weight: 900; }
    .delta {
      display: inline-block; margin-top: 34px; padding: 12px 22px;
      border-radius: 6px; background: var(--game-boost);
      color: var(--game-ink);
      font-family: var(--display); font-size: 38px; font-weight: 900;
      letter-spacing: .02em;
      opacity: var(--deltaOpacity, 0);
    }
    .deltarow { text-align: right; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="header">
      <div class="eyebrow">Competitive rating</div>
      <h1 id="headline">Rank up!</h1>
      <div class="accent"></div>
    </div>
    <div class="body">
      <section class="result">
        <div class="rank"><span class="label">Previous</span><span class="value" id="before">Gold II · 1480</span></div>
        <div class="arrow">&rarr;</div>
        <div class="rank new" id="promoted"><span class="label">Promoted</span><span class="value" id="after">Platinum I · 1512</span></div>
      </section>
      <div class="deltarow"><span class="delta" id="delta">+32 RATING</span></div>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    for (const id of ["headline", "before", "after", "delta"]) if (params.has(id)) document.getElementById(id).textContent = params.get(id);
    let elapsed = 0;
    const card = document.getElementById("card");
    const promoted = document.getElementById("promoted");
    const delta = document.getElementById("delta");
    // The app's own curves: 180ms entrance (game-over-card-in) and a 360ms
    // stamp (rating-medallion-stamp), both from client/web/index.css.
    const easeOut = (p) => 1 - Math.pow(1 - p, 3);
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const overshoot = (p) => { const t = clamp01(p); return 1 + 0.055 * Math.sin(Math.PI * t) - 0.04 * (1 - t); };
    const render = () => {
      const enter = easeOut(clamp01(elapsed / 180));
      card.style.setProperty("--scale", String(0.985 + 0.015 * enter));
      card.style.setProperty("--opacity", String(enter));
      promoted.style.setProperty("--stamp", String(0.96 + 0.04 * clamp01((elapsed - 520) / 360) * overshoot((elapsed - 520) / 360)));
      delta.style.setProperty("--deltaOpacity", String(easeOut(clamp01((elapsed - 900) / 320))));
    };
    render();
    const api = {
      ready: async () => { await document.fonts.ready; render(); },
      durationMs: () => 4000,
      stepMs: async (ms) => { elapsed += Number(ms); render(); },
      renderedTick: () => Math.round(elapsed),
      cueTrack: () => ({ anchors: { reveal: 0.85, settle: 1.4 }, duration: 4, capture_vfps: 60, encoded_fps: 60 })
    };
    window.__SNAKETRON_CAPTURE__ = api;
    window.__snaketronCapture = api;
  </script>
</body>
</html>
