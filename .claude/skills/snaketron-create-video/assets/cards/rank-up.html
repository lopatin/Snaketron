<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SnakeTron Rank-Up Capture Fixture</title>
  <style>
    @font-face { font-family: Barlow; src: url("../fonts/BarlowCondensed-ExtraBoldItalic.ttf"); font-weight: 800; font-style: italic; }
    @font-face { font-family: Inter; src: url("../fonts/Inter-Variable.ttf"); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #3f3f41; }
    body { display: grid; place-items: center; color: #fff; font-family: Inter, sans-serif; }
    body::before, body::after { content: ""; position: fixed; left: 8vw; right: 8vw; height: 6px; transform: skewX(-12deg); }
    body::before { top: 12vh; background: #3b82f6; }
    body::after { bottom: 12vh; background: #ef4444; }
    .card { width: min(72vw, 1220px); padding: 76px 92px; border: 4px solid #fff; background: #29292c; box-shadow: 18px 18px 0 #141416; transform: skewX(-4deg) scale(var(--scale, .9)); opacity: var(--opacity, 0); }
    .eyebrow { color: #f8c84a; font: 800 italic 38px Barlow, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0 42px; font: 800 italic clamp(100px, 10vw, 176px)/.82 Barlow, sans-serif; letter-spacing: .02em; text-transform: uppercase; text-shadow: 8px 8px #3f3f41; }
    .result { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 44px; }
    .rank { padding: 28px; border: 3px solid #5c5c60; text-align: center; }
    .rank.new { border-color: #f8c84a; background: #3b82f61c; box-shadow: 8px 8px 0 #f8c84a; }
    .label { color: #bfc0c5; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; }
    .value { display: block; margin-top: 8px; font: 800 italic 64px Barlow, sans-serif; }
    .arrow { color: #f6707b; font: 800 64px Barlow, sans-serif; }
    .delta { margin-top: 34px; color: #f8c84a; font: 800 italic 42px Barlow, sans-serif; text-align: right; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="eyebrow">Competitive rating</div>
    <h1 id="headline">Rank up!</h1>
    <section class="result">
      <div class="rank"><span class="label">Previous</span><span class="value" id="before">Gold II · 1480</span></div>
      <div class="arrow">→</div>
      <div class="rank new"><span class="label">Promoted</span><span class="value" id="after">Platinum I · 1512</span></div>
    </section>
    <div class="delta" id="delta">+32 RATING</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    for (const id of ["headline", "before", "after", "delta"]) if (params.has(id)) document.getElementById(id).textContent = params.get(id);
    let elapsed = 0;
    const card = document.getElementById("card");
    const render = () => {
      const p = Math.max(0, Math.min(1, elapsed / 850));
      const eased = 1 - Math.pow(1 - p, 3);
      card.style.setProperty("--scale", String(.9 + .1 * eased));
      card.style.setProperty("--opacity", String(eased));
    };
    render();
    const api = {
      ready: async () => { await document.fonts.ready; render(); },
      durationMs: () => 4000,
      stepMs: async (ms) => { elapsed += Number(ms); render(); },
      renderedTick: () => Math.round(elapsed),
      cueTrack: () => ({ anchors: { reveal: 0.85, settle: 1.4 }, duration: 4, capture_vfps: 60, encoded_fps: 60 })
    };
    window.__SNAKETRON_CAPTURE__ = api;
    window.__snaketronCapture = api;
  </script>
</body>
</html>
