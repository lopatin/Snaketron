[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
default = []
skip-proto = []
# Codegen-only: enables ts-rs and turns on common's ts-gen so the whole wire
# graph (protocol enum + shared game types) can be exported to TypeScript via
# `cargo test -p server --features ts-gen`. Off for all normal builds.
ts-gen = ["dep:ts-rs", "common/ts-gen"]

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"
test = false

[[bin]]
name = "trace_rca"
path = "src/bin/trace_rca.rs"
test = false

[dependencies]
common = { path = "../common" }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.19.0"
# 1.104, not 1.19: PutObject::if_none_match is what the pipeline's
# idempotency guarantee rests on.
aws-sdk-s3 = "1.104"
# v7 as well as v4: analytics event ids are time-sortable UUIDv7.
uuid = { version = "1", features = ["v4", "v7", "serde"] }
anyhow = "1"
thiserror = "1"
dotenv = "0.15"
once_cell = "1"
url = "2"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
gethostname = "1"
tonic = "0.12.3"
tokio-stream = { version = "0.1", features = ["sync"] }
prost = "0.13.5"
prost-reflect = { version = "0.14", features = ["serde"] }
async-trait = "0.1"
snaketron-service-api = { path = "../service-api" }
jsonwebtoken = "9.3"
bincode = { version = "2.0", features = ["serde"] }
flate2 = "1.0"
rand = "0.8"
rustrict = { version = "0.7.38", default-features = false, features = ["censor"] }
# HTTP API dependencies
axum = { version = "0.7", features = ["tokio", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
# Password hashing
bcrypt = "0.15"
redis = { version = "0.32.7", features = ["cluster-async", "connection-manager", "streams", "tokio-rustls-comp"] }
finl_unicode = "1.4"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
skillratings = "0.27"
indexmap = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ts-rs = { version = "11", optional = true }
# Iceberg catalog for the analytics committer. Pinned EXACTLY: these are 0.x
# crates whose API breaks roughly every two months, and `iceberg-catalog-s3tables`
# must move in lockstep with `iceberg` (it re-exports its `Catalog` trait).
iceberg = "=0.10.1"
iceberg-catalog-s3tables = "=0.10.1"
# Arrow and Parquet are the write path's data plane. Their versions are NOT
# independent choices: `iceberg` 0.10.1 depends on arrow 58 / parquet 58 and its
# writers take `arrow_array::RecordBatch` and `parquet::file::properties::
# WriterProperties` by value, so a different major here would be a different
# type and would not compile.
arrow-array = "58"
arrow-buffer = "58"
arrow-schema = "58"
parquet = "58"

[build-dependencies]
tonic-build = { version = "0.12.3", features = ["prost"] }
prost-build = "0.13.5"

[dev-dependencies]
# The DynamoDB lease tests drive the real SDK stack against a canned HTTP
# connector so the clock-offset interceptor is exercised without a network or
# a live table. `http_client_fn`/`SdkBody` are not re-exported by
# `aws-sdk-dynamodb`, hence the direct entries; both already resolve to the
# versions the SDK pulls in.
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
jsonwebtoken = "9.3"
tempfile = "3"
rand = "0.8"
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "testing"] }
